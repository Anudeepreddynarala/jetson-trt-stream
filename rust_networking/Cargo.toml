[package]
name = "yolo-rust-networking"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
tokio-util = { version = "0.7", features = ["codec"] }
sysinfo = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
